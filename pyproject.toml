[project]
name = "revagent"
version = "0.1.0"
description = "Autonomous reverse-engineering agent on self-hosted Qwen3.8 (vLLM)"
requires-python = ">=3.12"
dependencies = ["openai>=1.40"]

[project.scripts]
revagent = "revagent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["revagent*"]

[tool.setuptools.package-data]
revagent = ["ghidra_scripts/*.java", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
